name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Bump version
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure this version hasn't been tagged yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.pkg.outputs.version }}" > /dev/null; then
            echo "::error::Tag ${{ steps.pkg.outputs.version }} already exists — this shouldn't happen right after a fresh bump."
            exit 1
          fi

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${{ steps.pkg.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag and push
        run: |
          git tag "${{ steps.pkg.outputs.version }}"
          git push origin "${{ steps.pkg.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.version }}" \
            --title "${{ steps.pkg.outputs.version }}" \
            --generate-notes

      - name: Trigger npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.pkg.outputs.version }}"
