name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (auto detects it from commit messages)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A push from this workflow's own "Commit version bump" step would otherwise
    # re-trigger this same workflow on every release. GITHUB_TOKEN pushes are
    # already exempted from re-triggering workflows, but this is a cheap,
    # explicit second guard against a release loop.
    if: "${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: bump version to') }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Determine version bump type
        id: bumptype
        run: |
          INPUT_BUMP="${{ github.event.inputs.bump }}"
          if [ -n "$INPUT_BUMP" ] && [ "$INPUT_BUMP" != "auto" ]; then
            echo "type=$INPUT_BUMP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMITS=$(git log "$RANGE" --pretty=format:"%s%n%b")

          if echo "$COMMITS" | grep -qE "^BREAKING CHANGE|^[a-zA-Z]+(\([^)]*\))?!:"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$COMMITS" | grep -qE "^feat(\([^)]*\))?:"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        run: npm version ${{ steps.bumptype.outputs.type }} --no-git-tag-version

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Ensure this version hasn't been tagged yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.pkg.outputs.version }}" > /dev/null; then
            echo "::error::Tag ${{ steps.pkg.outputs.version }} already exists — this shouldn't happen right after a fresh bump."
            exit 1
          fi

      - name: Update README badge version
        run: |
          sed -i -E "s#(badge\.socket\.dev/npm/package/conftree/)[0-9]+\.[0-9]+\.[0-9]+#\1${{ steps.pkg.outputs.version }}#g" README.md

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to ${{ steps.pkg.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag and push
        run: |
          git tag "${{ steps.pkg.outputs.version }}"
          git push origin "${{ steps.pkg.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.version }}" \
            --title "${{ steps.pkg.outputs.version }}" \
            --generate-notes

      - name: Trigger npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ steps.pkg.outputs.version }}"
